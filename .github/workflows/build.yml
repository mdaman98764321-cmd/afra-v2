name: Build AFRA APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir project
          unzip -q afra-v2.zip -d project
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web app
        working-directory: project
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx vite build
      - name: Copy web app into Android project
        run: |
          rm -rf project/android/app/src/main/assets
          mkdir -p project/android/app/src/main/assets
          cp -r project/dist/. project/android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: project/android
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp project/android/app/build/outputs/apk/debug/app-debug.apk AFRA.apk
      - name: Publish APK for direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AFRA build ${{ github.run_number }}
          body: Download AFRA.apk below and install it over your current AFRA.
          files: AFRA.apk
          make_latest: true
